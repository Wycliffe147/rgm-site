<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGM Admin Dashboard</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--ink-deep); color: var(--parchment); font-family: var(--sans, sans-serif); min-height: 100vh; margin: 0; padding-top: 0; }
  /* Override global fixed header for admin - admin header scrolls with page */
  header { position: relative !important; top: auto !important; background: #0e121b !important; backdrop-filter: none !important; }
  .admin-header { background: #0e121b; border-bottom: 1px solid var(--line); padding: 16px 0; }
  .admin-nav { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .admin-title { font-family: var(--display); font-size: 1.25rem; font-weight: 700; color: var(--dawn-gold); display: flex; align-items: center; gap: 10px; }
  
  .auth-overlay { position: fixed; inset: 0; background: rgba(10, 14, 23, 0.95); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .auth-card { background: #151a24; border: 1px solid var(--line); border-radius: 12px; padding: 32px; max-width: 400px; width: 100%; box-shadow: 0 16px 48px rgba(0,0,0,0.5); text-align: center; }
  .auth-card h2 { color: var(--dawn-gold); margin-top: 0; margin-bottom: 8px; }
  
  .admin-tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-top: 24px; overflow-x: auto; padding-bottom: 2px; }
  .tab-btn { background: none; border: none; color: var(--parchment); opacity: 0.7; font-family: inherit; font-size: 0.95rem; font-weight: 600; padding: 12px 20px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
  .tab-btn:hover { opacity: 1; color: var(--dawn-gold); }
  .tab-btn.active { opacity: 1; color: var(--dawn-gold); border-bottom-color: var(--dawn-gold); background: rgba(230, 180, 80, 0.05); border-radius: 6px 6px 0 0; }
  
  .admin-container { padding: 32px 0 64px; }
  .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
  
  .admin-table-wrap { background: #131722; border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  .admin-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
  .admin-table th { background: rgba(255,255,255,0.03); padding: 14px 18px; color: var(--dawn-gold); font-family: var(--mono); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--line); }
  .admin-table td { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
  .admin-table tr:hover td { background: rgba(255,255,255,0.02); }
  
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 900; padding: 20px; }
  .modal-backdrop.open { display: flex; }
  .modal-box { background: #171c28; border: 1px solid var(--line); border-radius: 12px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .modal-box h3 { margin-top: 0; color: var(--dawn-gold); }
  
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: rgba(247,243,234,0.9); }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; background: #0c0f17; border: 1px solid var(--line); border-radius: 6px; color: #fff; font-family: inherit; font-size: 0.9rem; box-sizing: border-box; }
  .form-group textarea { min-height: 90px; resize: vertical; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--dawn-gold); }
  
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 4px; }
  .btn-danger { background: #b83232; color: #fff; border: none; cursor: pointer; }
  .btn-danger:hover { background: #d33838; }
  .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
  .badge-upcoming { background: rgba(76, 175, 80, 0.2); color: #81c784; border: 1px solid rgba(76, 175, 80, 0.4); }
  .badge-past { background: rgba(158, 158, 158, 0.2); color: #bdbdbd; border: 1px solid rgba(158, 158, 158, 0.4); }
  
  .toast { position: fixed; bottom: 24px; right: 24px; background: #1e2536; border: 1px solid var(--dawn-gold); color: #fff; padding: 12px 24px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: none; z-index: 2000; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>

  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">
</head>
<body>

<!-- Login Modal Overlay -->
<div id="authOverlay" class="auth-overlay">
  <div class="auth-card">
    <h2>RGM Admin Access</h2>
    <p style="font-size: 0.88rem; opacity: 0.8; margin-bottom: 24px;">Enter password to manage site content</p>
    <div class="form-group" style="text-align:left;">
      <label>Admin Password</label>
      <input type="password" id="authPasswordInput" placeholder="Enter password" onkeydown="if(event.key==='Enter') loginAdmin()">
    </div>
    <p id="authError" style="color: #ff6b6b; font-size: 0.85rem; display: none; margin-bottom: 14px;"></p>
    <button class="btn btn-primary" onclick="loginAdmin()" style="width:100%; justify-content:center;">Unlock Dashboard</button>
  </div>
</div>

<header class="admin-header">
  <div class="wrap admin-nav">
    <div class="admin-title">
      <img src="../logo.jpg" style="height:32px; width:32px; border-radius:50%;">
      Revealed Gospel Ministries - Content Dashboard
    </div>
    <div style="display:flex; gap:12px; align-items:center;">
      <a href="../index.html" target="_blank" class="btn btn-outline btn-sm">View Live Site ↗</a>
      <button class="btn btn-danger btn-sm" onclick="logoutAdmin()">Log Out</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="admin-tabs">
    <button class="tab-btn active" onclick="switchTab('crusades', this)">🎪 Crusades</button>
    <button class="tab-btn" onclick="switchTab('crusade-media', this)">📹 Crusade Highlights</button>
    <button class="tab-btn" onclick="switchTab('sermons', this)">📖 Sermons</button>
    <button class="tab-btn" onclick="switchTab('testimonies', this)">💬 Testimonies</button>
    <button class="tab-btn" onclick="switchTab('charity', this)">❤️ Charity Works</button>
    <button class="tab-btn" onclick="switchTab('excellency', this)">🎓 Excellency</button>
  </div>
</div>

<main class="wrap admin-container">
  <!-- Content Panels rendered dynamically -->
  <div id="tabContent"></div>
</main>

<!-- Generic Modal Form Container -->
<div id="formModal" class="modal-backdrop">
  <div class="modal-box">
    <h3 id="modalTitle">Add Item</h3>
    <form id="modalForm" onsubmit="handleFormSubmit(event)">
      <div id="modalFields"></div>
      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
        <button type="button" class="btn btn-outline-dark" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Item</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast">Saved successfully</div>

<script>
window.onerror = function(message, source, lineno, colno, error) {
  alert("JS Error: " + message + " at line " + lineno + ":" + colno);
  return false;
};
let currentTab = 'crusades';
let currentEditingId = null;
let currentData = [];

function getAuthHeader() {
  const pwd = sessionStorage.getItem('rgm_admin_pwd') || '';
  return { 'Authorization': `Basic ${btoa(':' + pwd)}`, 'Content-Type': 'application/json' };
}

async function loginAdmin() {
  const pwdInput = document.getElementById('authPasswordInput');
  const errorEl = document.getElementById('authError');
  const pwd = pwdInput.value.trim();
  
  if (!pwd) return;
  errorEl.style.display = 'none';

  try {
    const res = await fetch('/api/admin/verify', {
      headers: { 'Authorization': `Basic ${btoa(':' + pwd)}` }
    });
    if (!res.ok) throw new Error('Invalid Password');
    
    sessionStorage.setItem('rgm_admin_pwd', pwd);
    document.getElementById('authOverlay').style.display = 'none';
    loadCurrentTab();
  } catch (err) {
    errorEl.textContent = 'Incorrect password. Access denied.';
    errorEl.style.display = 'block';
  }
}

function logoutAdmin() {
  sessionStorage.removeItem('rgm_admin_pwd');
  location.reload();
}

async function checkAuthOnLoad() {
  const pwd = sessionStorage.getItem('rgm_admin_pwd');
  if (!pwd) {
    document.getElementById('authOverlay').style.display = 'flex';
    return;
  }
  
  try {
    const res = await fetch('/api/admin/verify', { headers: { 'Authorization': `Basic ${btoa(':' + pwd)}` } });
    if (!res.ok) throw new Error('Session expired');
    document.getElementById('authOverlay').style.display = 'none';
    loadCurrentTab();
  } catch {
    sessionStorage.removeItem('rgm_admin_pwd');
    document.getElementById('authOverlay').style.display = 'flex';
  }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}
function updateDateFieldsVisibility() {
  const dateType = document.getElementById('field_date_type')?.value || 'legacy';
  document.getElementById('legacy_date_fields').style.display = dateType === 'legacy' ? 'block' : 'none';
  document.getElementById('single_date_fields').style.display = dateType === 'single' ? 'block' : 'none';
  document.getElementById('continuous_date_fields').style.display = dateType === 'continuous' ? 'block' : 'none';
  document.getElementById('separate_date_fields').style.display = dateType === 'separate' ? 'block' : 'none';
  
  const statusWrapper = document.getElementById('status_field_wrapper');
  if (statusWrapper) {
    statusWrapper.style.display = dateType === 'legacy' ? 'block' : 'none';
  }
}

function switchTab(tabName, el) {
  currentTab = tabName;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  if (el) el.classList.add('active');
  loadCurrentTab();
}

async function loadCurrentTab() {
  const container = document.getElementById('tabContent');
  container.innerHTML = `<p style="opacity:0.6;">Loading content...</p>`;

  const endpoints = {
    'crusades': '/api/admin/crusades',
    'crusade-media': '/api/admin/crusade-media',
    'sermons': '/api/admin/sermons',
    'testimonies': '/api/admin/testimonies',
    'charity': '/api/admin/charity-stories',
    'excellency': '/api/admin/excellency-stories'
  };

  try {
    const res = await fetch(endpoints[currentTab], { headers: getAuthHeader() });
    if (!res.ok) throw new Error('Failed to fetch');
    currentData = await res.json();
    renderTabUI(currentData);
  } catch (err) {
    container.innerHTML = `<p style="color:#ff6b6b;">Failed to load data: ${err.message}</p>`;
  }
}

function renderTabUI(data) {
  const container = document.getElementById('tabContent');
  
  if (currentTab === 'crusades') {
    container.innerHTML = `
      <div class="action-bar">
        <h2>Crusades (${data.length})</h2>
        <button class="btn btn-primary" onclick="openFormModal()">+ Add New Crusade</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Status</th><th>Title</th><th>Slug</th><th>Date Range</th><th>Location</th><th>Home</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.map(c => `
              <tr>
                <td><span class="badge ${c.status==='upcoming'?'badge-upcoming':'badge-past'}">${c.status}</span></td>
                <td><strong>${escapeHtml(c.title)}</strong></td>
                <td><code>${escapeHtml(c.slug)}</code></td>
                <td>${escapeHtml(c.formatted_date||c.date_range||'')}</td>
                <td>${escapeHtml(c.location||'')}</td>
                <td>${c.show_on_home ? '<span class="badge" style="background:rgba(230,180,80,0.2); color:var(--dawn-gold); border:1px solid rgba(230,180,80,0.4);">⭐ Featured</span>' : '<span style="opacity:0.5;">No</span>'}</td>
                <td>
                  <button class="btn btn-outline-dark btn-sm" onclick="editItem(${c.id})">Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteItem('/api/admin/crusades', ${c.id})">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  } else if (currentTab === 'crusade-media') {
    container.innerHTML = `
      <div class="action-bar">
        <h2>Crusade Video Highlights (${data.length})</h2>
        <button class="btn btn-primary" onclick="openFormModal()">+ Attach Video Highlight</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Crusade</th><th>Video Title</th><th>YouTube Link</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.map(m => `
              <tr>
                <td><strong>${escapeHtml(m.crusade_title||'')}</strong></td>
                <td>${escapeHtml(m.title||'Highlight Video')}</td>
                <td><a href="${escapeHtml(m.youtube_url)}" target="_blank" style="color:var(--dawn-gold);">${escapeHtml(m.youtube_url)}</a></td>
                <td>
                  <button class="btn btn-danger btn-sm" onclick="deleteItem('/api/admin/crusade-media', ${m.id})">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  } else if (currentTab === 'sermons') {
    container.innerHTML = `
      <div class="action-bar">
        <h2>Sermons (${data.length})</h2>
        <button class="btn btn-primary" onclick="openFormModal()">+ Add New Sermon</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Title</th><th>Speaker</th><th>YouTube URL</th><th>Home</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.map(s => `
              <tr>
                <td><strong>${escapeHtml(s.title)}</strong></td>
                <td>${escapeHtml(s.speaker||'--')}</td>
                <td><a href="${escapeHtml(s.youtube_url)}" target="_blank" style="color:var(--dawn-gold);">${escapeHtml(s.youtube_url)}</a></td>
                <td>${s.show_on_home ? '<span class="badge" style="background:rgba(230,180,80,0.2); color:var(--dawn-gold); border:1px solid rgba(230,180,80,0.4);">⭐ Featured</span>' : '<span style="opacity:0.5;">No</span>'}</td>
                <td>
                  <button class="btn btn-outline-dark btn-sm" onclick="editItem(${s.id})">Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteItem('/api/admin/sermons', ${s.id})">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  } else if (currentTab === 'testimonies') {
    container.innerHTML = `
      <div class="action-bar">
        <h2>Testimonies (${data.length})</h2>
        <button class="btn btn-primary" onclick="openFormModal()">+ Add New Testimony</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Title</th><th>Linked Crusade</th><th>YouTube URL</th><th>Home</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.map(t => `
              <tr>
                <td><strong>${escapeHtml(t.title)}</strong></td>
                <td>${escapeHtml(t.crusade_title||'General')}</td>
                <td><a href="${escapeHtml(t.youtube_url)}" target="_blank" style="color:var(--dawn-gold);">${escapeHtml(t.youtube_url)}</a></td>
                <td>${t.show_on_home ? '<span class="badge" style="background:rgba(230,180,80,0.2); color:var(--dawn-gold); border:1px solid rgba(230,180,80,0.4);">⭐ Featured</span>' : '<span style="opacity:0.5;">No</span>'}</td>
                <td>
                  <button class="btn btn-outline-dark btn-sm" onclick="editItem(${t.id})">Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteItem('/api/admin/testimonies', ${t.id})">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  } else if (currentTab === 'charity') {
    container.innerHTML = `
      <div class="action-bar">
        <h2>Charity Stories (${data.length})</h2>
        <button class="btn btn-primary" onclick="openFormModal()">+ Add Charity Story</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Title</th><th>Beneficiary</th><th>Location</th><th>Media</th><th>Home</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.map(c => `
              <tr>
                <td><strong>${escapeHtml(c.title)}</strong></td>
                <td>${escapeHtml(c.beneficiary_name||'--')}</td>
                <td>${escapeHtml(c.location||'--')}</td>
                <td>${c.youtube_url?'Video':(c.photo_url?'Photo':'Text')}</td>
                <td>${c.show_on_home ? '<span class="badge" style="background:rgba(230,180,80,0.2); color:var(--dawn-gold); border:1px solid rgba(230,180,80,0.4);">⭐ Featured</span>' : '<span style="opacity:0.5;">No</span>'}</td>
                <td>
                  <button class="btn btn-outline-dark btn-sm" onclick="editItem(${c.id})">Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteItem('/api/admin/charity-stories', ${c.id})">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  } else if (currentTab === 'excellency') {
    container.innerHTML = `
      <div class="action-bar">
        <h2>Excellency Stories (${data.length})</h2>
        <button class="btn btn-primary" onclick="openFormModal()">+ Add Excellency Story</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Title</th><th>Meta Info</th><th>YouTube URL</th><th>Home</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.map(item => `
              <tr>
                <td><strong>${escapeHtml(item.title)}</strong></td>
                <td>${escapeHtml(item.meta||'--')}</td>
                <td><a href="${escapeHtml(item.youtube_url)}" target="_blank" style="color:var(--dawn-gold);">${escapeHtml(item.youtube_url)}</a></td>
                <td>${item.show_on_home ? '<span class="badge" style="background:rgba(230,180,80,0.2); color:var(--dawn-gold); border:1px solid rgba(230,180,80,0.4);">⭐ Featured</span>' : '<span style="opacity:0.5;">No</span>'}</td>
                <td>
                  <button class="btn btn-outline-dark btn-sm" onclick="editItem(${item.id})">Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteItem('/api/admin/excellency-stories', ${item.id})">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }
}

async function openFormModal(editItemObj = null) {
  currentEditingId = editItemObj ? editItemObj.id : null;
  const titleEl = document.getElementById('modalTitle');
  const fieldsEl = document.getElementById('modalFields');
  const isEdit = !!editItemObj;

  if (currentTab === 'crusades') {
    titleEl.textContent = isEdit ? 'Edit Crusade' : 'Add New Crusade';
    fieldsEl.innerHTML = `
      <div class="form-group"><label>Title *</label><input type="text" id="field_title" value="${escapeAttr(editItemObj?.title)}" required></div>
      <div class="form-group"><label>Slug (URL identifier, e.g. 'mzuzu') *</label><input type="text" id="field_slug" value="${escapeAttr(editItemObj?.slug)}" required></div>
      <div class="form-group" id="status_field_wrapper">
        <label>Status *</label>
        <select id="field_status">
          <option value="upcoming" ${editItemObj?.status==='upcoming'?'selected':''}>Upcoming</option>
          <option value="past" ${editItemObj?.status==='past'?'selected':''}>Past</option>
        </select>
      </div>
      <div class="form-group"><label>Location</label><input type="text" id="field_location" value="${escapeAttr(editItemObj?.location)}"></div>
      <div class="form-group">
        <label>Date Type *</label>
        <select id="field_date_type" onchange="updateDateFieldsVisibility()" required>
          <option value="legacy" ${editItemObj?.date_type==='legacy'?'selected':''}></label>Legacy (text format)</option>
          <option value="single" ${editItemObj?.date_type==='single'?'selected':''}></label>Single Day</option>
          <option value="continuous" ${editItemObj?.date_type==='continuous'?'selected':''}></label>Continuous Range</option>
          <option value="separate" ${editItemObj?.date_type==='separate'?'selected':''}></label>Separate Dates</option>
        </select>
      </div>
      <div id="legacy_date_fields" style="display:none;">
        <div class="form-group"><label>Date Range Text (e.g. "Oct 9-11, 2026")</label><input type="text" id="field_date_range" value="${escapeAttr(editItemObj?.date_range)}"></div>
      </div>
      <div id="single_date_fields" style="display:none;">
        <div class="form-group"><label>Date</label><input type="date" id="field_start_date" value="${editItemObj?.start_date||''}"></div>
      </div>
      <div id="continuous_date_fields" style="display:none;">
        <div class="form-group"><label>Start Date</label><input type="date" id="field_start_date_cont" value="${editItemObj?.start_date||''}"></div>
        <div class="form-group"><label>End Date</label><input type="date" id="field_end_date_cont" value="${editItemObj?.end_date||''}"></div>
      </div>
      <div id="separate_date_fields" style="display:none;">
        <div class="form-group">
          <label>Dates (comma or newline separated, format: YYYY-MM-DD)</label>
          <textarea id="field_custom_dates" placeholder="2026-10-09&#10;2026-10-15" style="min-height:80px; font-family:monospace; font-size:0.9rem;">${(() => { try { return JSON.parse(editItemObj?.custom_dates || "[]").join('\n'); } catch(e) { return ''; } })()}</textarea>
        </div>
      </div>
      <div class="form-group">
        <label>Poster Image</label>
        <div style="display:flex; gap:10px; align-items:center;">
          <input type="file" id="field_poster_file" accept="image/*" onchange="handleImageUpload(this, document.getElementById('field_poster_url'), document.getElementById('poster_preview'))" style="flex:1;">
          <span style="opacity:0.5; font-size:0.9rem;">or paste URL:</span>

async function handleFormSubmit(e) {
  e.preventDefault();
  try {
    const isEdit = !!currentEditingId;
    let payload = {};
    let endpoint = '';

  if (currentTab === 'crusades') {
    endpoint = '/api/admin/crusades';
    const dateType = document.getElementById('field_date_type').value;
    let datePayload = { date_type: dateType };
    
    if (dateType === 'legacy') {
      datePayload.date_range = document.getElementById('field_date_range').value.trim();
    } else if (dateType === 'single') {
      datePayload.start_date = document.getElementById('field_start_date').value;
      datePayload.date_range = datePayload.start_date ? new Date(datePayload.start_date).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}) : '';
    } else if (dateType === 'continuous') {
      datePayload.start_date = document.getElementById('field_start_date_cont').value;
      datePayload.end_date = document.getElementById('field_end_date_cont').value;
      if (datePayload.start_date && datePayload.end_date) {
        const s = new Date(datePayload.start_date);
        const e = new Date(datePayload.end_date);
        const sStr = s.toLocaleDateString('en-US', {month:'short',day:'numeric'});
        const eStr = e.toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'});
        datePayload.date_range = `${sStr} - ${eStr}`;
      }
    } else if (dateType === 'separate') {
      const datesText = document.getElementById('field_custom_dates').value.trim();
      const dateLines = datesText.split('\n').map(l => l.trim()).filter(l => l);
      datePayload.custom_dates = dateLines.length > 0 ? JSON.stringify(dateLines) : null;
      if (dateLines.length > 0) {
        datePayload.date_range = dateLines.map(d => new Date(d).toLocaleDateString('en-US', {month:'short',day:'numeric'})).join(', ') + ', ' + new Date(dateLines[0]).getFullYear();
      }
    }
    
    payload = {
      id: currentEditingId,
      title: document.getElementById('field_title').value.trim(),
      slug: document.getElementById('field_slug').value.trim(),
      status: document.getElementById('field_status').value,
      location: document.getElementById('field_location').value.trim(),
      poster_url: document.getElementById('field_poster_url').value.trim(),
      description: document.getElementById('field_description').value.trim(),
      full_description: document.getElementById('field_full_description').value.trim(),
      partner_churches: document.getElementById('field_partner_churches').value.trim(),
      show_on_home: document.getElementById('field_show_on_home').checked ? 1 : 0,
      ...datePayload
    };
  } else if (currentTab === 'crusade-media') {
    endpoint = '/api/admin/crusade-media';
    payload = {
      crusade_id: parseInt(document.getElementById('field_crusade_id').value, 10),

    };
  } else if (currentTab === 'sermons') {
    endpoint = '/api/admin/sermons';
    payload = {
      id: currentEditingId,
      title: document.getElementById('field_title').value.trim(),
      speaker: document.getElementById('field_speaker').value.trim(),
      youtube_url: document.getElementById('field_youtube_url').value.trim(),

    };
  } else if (currentTab === 'testimonies') {

    };
  } else if (currentTab === 'charity') {
    endpoint = '/api/admin/charity-stories';
    payload = {
      id: currentEditingId,
      title: document.getElementById('field_title').value.trim(),
      beneficiary_name: document.getElementById('field_beneficiary_name').value.trim(),

      full_description: document.getElementById('field_full_description').value.trim(),
      show_on_home: document.getElementById('field_show_on_home').checked ? 1 : 0
    };
  } else if (currentTab === 'excellency') {
    endpoint = '/api/admin/excellency-stories';
    payload = {
      id: currentEditingId,
      title: document.getElementById('field_title').value.trim(),
      meta: document.getElementById('field_meta').value.trim(),
      youtube_url: document.getElementById('field_youtube_url').value.trim(),
      description: document.getElementById('field_description').value.trim(),
      full_description: document.getElementById('field_full_description').value.trim(),

  }

  const method = isEdit ? 'PATCH' : 'POST';
    const res = await fetch(endpoint, {

async function deleteItem(endpoint, id) {

  try {
    const res = await fetch(`${endpoint}?id=${id}`, {
      method: 'DELETE',
      headers: getAuthHeader()
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || 'Delete failed');
    showToast('Deleted successfully');
    loadCurrentTab();
  } catch (err) {
    alert(`Delete failed: ${err.message}`);
  }
}

function escapeHtml(str) {
  return String(str||'').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escapeAttr(str) {
  return String(str||'').replace(/"/g, '&quot;');
}

async function handleImageUpload(inputEl, urlEl, previewEl) {
  const file = inputEl.files[0];
  if (!file) return;

  const originalLabel = inputEl.parentElement.previousElementSibling ? inputEl.parentElement.previousElementSibling.textContent : '';
  if (inputEl.parentElement.previousElementSibling) {
    inputEl.parentElement.previousElementSibling.textContent = 'Processing image...';
  }

  try {
    const base64 = await compressAndResizeImage(file);
    urlEl.value = base64;
    
    if (previewEl) {
      previewEl.src = base64;
      previewEl.style.display = 'block';
    }
  } catch (err) {
    alert('Failed to process image: ' + err.message);
  } finally {
    if (inputEl.parentElement.previousElementSibling) {
      inputEl.parentElement.previousElementSibling.textContent = originalLabel;
    }
  }
}

function compressAndResizeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        
        const MAX_DIM = 1024;
        if (width > MAX_DIM || height > MAX_DIM) {
          if (width > height) {
            height = Math.round((height * MAX_DIM) / width);
            width = MAX_DIM;
          } else {
            width = Math.round((width * MAX_DIM) / height);
            height = MAX_DIM;
          }
        }
        
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        const base64 = canvas.toDataURL('image/jpeg', 0.75);
        resolve(base64);
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}
