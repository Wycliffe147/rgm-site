<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Converts Portal | Revealed Gospel Ministries</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body {
    background: radial-gradient(circle at 50% 50%, var(--ink), var(--ink-deep));
    color: var(--parchment);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    margin: 0;
    font-family: var(--body);
  }
  .login-card {
    background: rgba(21, 26, 36, 0.6);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    text-align: center;
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .login-logo {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 1px solid var(--line);
    margin-bottom: 20px;
    object-fit: cover;
  }
  .login-card h2 {
    font-family: var(--display);
    font-size: 1.8rem;
    color: var(--dawn-gold);
    margin-top: 0;
    margin-bottom: 8px;
  }
  .login-card p {
    font-size: 0.88rem;
    opacity: 0.75;
    margin-bottom: 32px;
  }
  .form-group {
    text-align: left;
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-family: var(--mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--dawn-gold);
    margin-bottom: 8px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(14, 28, 59, 0.6);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    box-sizing: border-box;
    transition: border-color 0.2s;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--dawn-gold);
  }
  .btn-submit {
    width: 100%;
    justify-content: center;
    margin-top: 10px;
    background: var(--dawn-gold);
    color: var(--ink-deep);
    border: none;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.2s, transform 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .btn-submit:hover {
    background: var(--dawn-amber);
    transform: translateY(-2px);
  }
  .error-message {
    color: #ff6b6b;
    font-size: 0.85rem;
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid rgba(255, 107, 107, 0.2);
    padding: 10px;
    border-radius: 4px;
    margin-bottom: 20px;
    display: none;
    text-align: left;
  }
</style>

  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">
</head>
<body>

<div class="login-card">
  <img src="../logo.jpg" alt="RGM Logo" class="login-logo">
  <h2>New Converts &amp; Follow-ups</h2>
  <p>Revealed Gospel Ministries Outreach Database</p>

  <div id="errorBox" class="error-message"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" placeholder="Enter username" required autocomplete="username">
    </div>
    <div class="form-group" style="margin-bottom: 28px;">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="Enter password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">
      <span>Secure Log In</span>
    </button>
  </form>
</div>

<script>
  // Redirect immediately if already logged in and token verified
  if (sessionStorage.getItem('rgm_converts_token')) {
    location.href = 'index.html';
  }

  async function handleLogin(e) {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value;

    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.querySelector('span').textContent = 'Authenticating...';

    try {
      const res = await fetch('/api/converts-portal/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Login failed. Please check credentials.');
      }

      // Save credentials and session to storage
      sessionStorage.setItem('rgm_converts_token', data.token);
      sessionStorage.setItem('rgm_converts_username', data.username);
      sessionStorage.setItem('rgm_converts_fullname', data.full_name);
      sessionStorage.setItem('rgm_converts_role', data.role);

      location.href = 'index.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.querySelector('span').textContent = 'Secure Log In';
    }
  }
</script>
</body>
</html>
